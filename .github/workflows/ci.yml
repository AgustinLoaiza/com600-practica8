
name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Traer el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js 22 con caché
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar la suite de la Práctica 7
        run: npm test

      - name: Generar el reporte de cobertura
        run: npm run test:cov

      - name: Publicar el reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ github.sha }}
          path: coverage/
          retention-days: 7
